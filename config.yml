# =============================================================================
# Ruijie Switch Configuration Collector  —  config.yml
# =============================================================================
# 复制此文件并根据实际环境修改。
# Copy this file and edit it for your environment.
# =============================================================================

# -----------------------------------------------------------------------------
# 认证 / Authentication
# -----------------------------------------------------------------------------
# 有两种方式提供认证信息：
# There are two ways to supply credentials:
#
# 方式 1 — 直接提供 auth token（推荐）
# Option 1 — Provide the raw auth token (recommended)
#   在浏览器开发者工具中，打开 Network 标签，在登录时
#   找到对 /login.do 的 POST 请求，复制 Form Data 中
#   的 auth 字段值，粘贴到下方。
#
#   In the browser DevTools → Network tab, capture the POST
#   to /login.do and copy the "auth" form field value.
#
# 方式 2 — 提供用户名和密码（工具自动编码）
# Option 2 — Provide username and password (auto-encoded)
#   工具会以锐捷 Web 管理界面的方式对凭据进行多轮
#   Base64 编码（默认 9 轮）。
#
#   The tool will apply Ruijie's multi-round Base64 encoding
#   (default: 9 rounds) to generate the auth token.
# -----------------------------------------------------------------------------
auth:
  # --- Option 1: raw token (takes precedence if set) ---
  # token: "aFhTRUpVVmxWYVYxWlZNYUZo..."

  # --- Option 2: username / password ---
  username: "admin"
  password: "your_password_here"

  # Number of Base64 encoding rounds (default: 9, matches most Ruijie firmware)
  # 编码轮数（默认 9，与大多数锐捷固件一致）
  # encoding_rounds: 9


# -----------------------------------------------------------------------------
# 目标设备 / Targets
# -----------------------------------------------------------------------------
# 支持三种指定方式，可同时使用：
# Three formats are supported and can be combined:
#
#   ips      – explicit single IPs
#   subnets  – CIDR notation  (all host addresses are scanned)
#   ranges   – dash notation  (A.B.C.START-END)
# -----------------------------------------------------------------------------
targets:
  # 单个 IP / Individual IPs
  ips:
    - 172.31.99.83
    # - 172.31.99.84

  # 整个网段 / Entire subnet (CIDR)
  # subnets:
  #   - 172.31.99.0/24
  #   - 10.0.0.0/22

  # IP 范围 / IP range (last-octet range)
  # ranges:
  #   - 172.31.99.1-254
  #   - 10.0.1.1-100


# -----------------------------------------------------------------------------
# 请求参数 / Request settings
# -----------------------------------------------------------------------------
request:
  # Connection / read timeout in seconds  连接/读取超时（秒）
  timeout: 10

  # Verify HTTPS certificates  是否校验 HTTPS 证书
  # Set to false for switches with self-signed certificates.
  # 交换机通常使用自签名证书，建议保持 false。
  verify_ssl: false

  # Maximum concurrent connections  最大并发连接数
  concurrent: 5
