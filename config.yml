# =============================================================================
# Ruijie Switch Configuration Collector — config.yml
# =============================================================================
# 复制此文件并根据实际环境修改。
# Copy this file and edit it for your environment.
# =============================================================================

# -----------------------------------------------------------------------------
# 认证 / Authentication
# -----------------------------------------------------------------------------
# 有两种方式提供认证信息：
# There are two ways to supply credentials:
#
# 方式 1 — 直接提供 auth token（推荐）
# Option 1 — Provide the raw auth token (recommended)
#   在浏览器开发者工具中，打开 Network 标签，找到登录时
#   对 /login.do 的 POST 请求，复制 Form Data 中的 auth 字段值。
#
#   In the browser DevTools → Network tab, capture the POST to /login.do
#   and copy the "auth" form field value directly.
#
# 方式 2 — 提供明文用户名和密码（工具自动编码）
# Option 2 — Provide username and password (auto-encoded)
#   工具会按照 base.dao.js / login.js 中 getPasswordEncode() 的逻辑，
#   进行 5 轮"Base64 编码 + 前缀拼接"来生成 token。
#
#   The tool applies Ruijie's getPasswordEncode() algorithm:
#     5 rounds of: base64_encode(current) → prepend "aFhTRUpVVmxWYVYxWlZN"
# -----------------------------------------------------------------------------
auth:
  # --- Option 1: raw token (takes precedence when set) ---
  # token: "aFhTRUpVVmxWYVYxWlZN..."

  # --- Option 2: plaintext credentials (auto-encoded at runtime) ---
  username: "admin"
  password: "ruijie@123"


# -----------------------------------------------------------------------------
# 目标设备 / Targets
# -----------------------------------------------------------------------------
# 支持三种格式，可同时混用。
# Three formats are supported and can be combined freely.
#
#   ips      – 单个 IP / explicit single IPs
#   subnets  – CIDR 网段 / CIDR notation (all host addresses are scanned)
#   ranges   – 末段范围  / dash notation  (A.B.C.START-END)
# -----------------------------------------------------------------------------
targets:
  # 单个 IP / Individual IPs
  ips:
    - 172.31.99.83
    # - 172.31.99.84

  # 整个网段 / Entire subnet (CIDR)
  # subnets:
  #   - 172.31.99.0/24
  #   - 10.0.0.0/22

  # IP 范围 / IP range
  # ranges:
  #   - 172.31.99.1-254
  #   - 10.0.1.1-100


# -----------------------------------------------------------------------------
# 请求参数 / Request settings
# -----------------------------------------------------------------------------
request:
  # Connection / read timeout in seconds  连接/读取超时（秒）
  timeout: 10

  # Verify HTTPS certificate  是否校验 HTTPS 证书
  # Ruijie switches typically use self-signed certificates — keep false.
  # 交换机通常使用自签名证书，建议保持 false。
  verify_ssl: false

  # Max concurrent threads  最大并发线程数
  concurrent: 5
